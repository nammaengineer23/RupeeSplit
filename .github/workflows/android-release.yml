name: RupeeSplit Android APK and AAB

on:
  push:
    branches:
      - android-play-readiness
    paths:
      - ".github/workflows/android-release.yml"
      - "package.json"
      - "capacitor.config.ts"
      - "src/**"
      - "public/**"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build signed APK for phone testing and AAB for Play Console"
        type: choice
        options: [release]
        default: release

permissions:
  contents: read

concurrency:
  group: rupeesplit-android-release
  cancel-in-progress: false

jobs:
  android-aab:
    name: Build signed Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Check release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required repository secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the four Android signing secrets in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Build web application
        run: npm run build

      - name: Generate and sync Capacitor Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Android release signing and target SDK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rupeesplit-release.keystore"
          test -s "$RUNNER_TEMP/rupeesplit-release.keystore"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/rupeesplit-release.keystore"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle")
          s = p.read_text()
          if "signingConfigs" not in s:
              marker = "    buildTypes {"
              if marker not in s:
                  raise SystemExit("Could not locate buildTypes in android/app/build.gradle")
              signing = """    signingConfigs {
                  release {
                      storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
              }

          """
              s = s.replace(marker, signing + marker, 1)
          release = re.search(r"(?m)^(\s*)release\s*\{", s)
          if not release:
              raise SystemExit("Could not locate release build type")
          block_start = release.end()
          s = s[:block_start] + "\n            signingConfig signingConfigs.release" + s[block_start:]
          p.write_text(s)
          variables = Path("android/variables.gradle")
          if not variables.exists():
              raise SystemExit("Could not locate android/variables.gradle to set target SDK")
          v = variables.read_text()
          v, count = re.subn(r"(targetSdkVersion\s*=\s*)\d+", r"\g<1>36", v, count=1)
          if count != 1:
              raise SystemExit("Could not set targetSdkVersion 36 in android/variables.gradle")
          variables.write_text(v)
          PY

      - name: Build signed APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/rupeesplit-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify signed APK and AAB exist
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          test -s android/app/build/outputs/bundle/release/app-release.aab
          ls -lh android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed APK for phone testing
        uses: actions/upload-artifact@v4
        with:
          name: rupeesplit-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed AAB for Play Console
        uses: actions/upload-artifact@v4
        with:
          name: rupeesplit-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
