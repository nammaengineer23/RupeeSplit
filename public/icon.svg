<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Squircle with Safe Zone -->
  <rect width="512" height="512" rx="128" fill="url(#brandGrad)" />

  <!-- Inner Circle with Elevation -->
  <circle cx="256" cy="256" r="180" fill="#ffffff" opacity="0.12" />

  <!-- Main Symbol: Bold Currency Glyph (₹ / Split) -->
  <g filter="url(#shadow)">
    <!-- Main Indian Rupee Horizontal Bars -->
    <path d="M176 156 H336" stroke="#ffffff" stroke-width="36" stroke-linecap="round" />
    <path d="M176 216 H336" stroke="#ffffff" stroke-width="36" stroke-linecap="round" />

    <!-- Rupee Curve and Stem -->
    <path d="M226 156 V276 C286 276 306 256 306 216" stroke="#ffffff" stroke-width="36" stroke-linecap="round" fill="none" />

    <!-- Split Arrow Slash (down right) -->
    <path d="M226 276 L326 386" stroke="#34d399" stroke-width="36" stroke-linecap="round" />
    <path d="M186 276 L226 276" stroke="#ffffff" stroke-width="36" stroke-linecap="round" />
  </g>
</svg>
